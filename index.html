<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البوابة الإلكترونية للحالة المدنية - Kiosk</title>
    <style>
        /* --- CSS STYLES --- */
        :root {
            --primary-color: #0056b3; 
            --secondary-color: #f8f9fa;
            --text-color: #333;
            --accent-color: #28a745; 
            --bg-color: #e9ecef;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; transition: direction 0.3s; }

        .lang-btn {
            position: absolute; top: 20px; right: 20px; 
            background-color: white; color: var(--primary-color); border: 2px solid var(--primary-color);
            padding: 10px 20px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; z-index: 100;
        }

        .lang-btn:hover { background-color: var(--primary-color); color: white; }

        html[dir="ltr"] .lang-btn { right: auto; left: 20px; }

        .kiosk-header { background-color: var(--primary-color); color: white; text-align: center; padding: 40px 20px 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .kiosk-header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .kiosk-header p { font-size: 1.2rem; opacity: 0.9; }

        .kiosk-container { flex: 1; padding: 40px; max-width: 1200px; margin: 0 auto; width: 100%; }

        h2 { font-size: 2rem; margin-bottom: 30px; color: var(--primary-color); border-bottom: 3px solid var(--primary-color); display: inline-block; padding-bottom: 10px; }

        .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

        button { font-size: 1.3rem; padding: 25px 20px; border-radius: 12px; border: none; cursor: pointer; transition: all 0.2s ease-in-out; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:active { transform: scale(0.98); }

        .btn-category { background-color: white; color: var(--primary-color); border: 3px solid var(--primary-color); }
        .btn-service { background-color: white; color: #444; border: 2px solid #ccc; }
        .btn-category:hover, .btn-service:hover { background-color: var(--primary-color); color: white; }
        .btn-primary { background-color: var(--primary-color); color: white; padding: 15px 30px; font-size: 1.2rem; }
        .btn-secondary { background-color: #6c757d; color: white; padding: 15px 30px; font-size: 1.2rem; margin-bottom: 20px; }

        .active-section { display: block; animation: fadeIn 0.5s ease-in; }
        .hidden-section { display: none; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); }
        .modal-content { background-color: white; margin: 5% auto; padding: 40px; border-radius: 15px; width: 80%; max-width: 800px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }

        .close-btn { position: absolute; top: 20px; font-size: 40px; cursor: pointer; color: #aaa; }
        html[dir="rtl"] .close-btn { left: 30px; }
        html[dir="ltr"] .close-btn { right: 30px; }
        .close-btn:hover { color: black; }

        #requirements-list { margin-top: 20px; font-size: 1.3rem; line-height: 1.8; }
        html[dir="rtl"] #requirements-list { padding-right: 30px; }
        html[dir="ltr"] #requirements-list { padding-left: 30px; }
        #requirements-list li { margin-bottom: 15px; }

        .modal-actions { margin-top: 40px; display: flex; gap: 20px; justify-content: center; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <button id="lang-toggle" class="lang-btn">Français</button>

    <header class="kiosk-header">
        <h1 id="ui-main-title">البوابة الإلكترونية للحالة المدنية</h1>
        <p id="ui-sub-title">دليل المواطن في قضايا الحالة المدنية - المحكمة الابتدائية</p>
    </header>

    <main class="kiosk-container">
        <section id="category-section" class="active-section">
            <h2 id="ui-step1-title">1. يرجى اختيار نوع الخدمة:</h2>
            <div id="categories-grid" class="btn-grid"></div>
        </section>

        <section id="services-section" class="hidden-section">
            <button id="back-to-categories" class="btn-secondary">🔙 رجوع للرئيسية</button>
            <h2 id="selected-category-title">2. اختر الطلب:</h2>
            <div id="services-grid" class="btn-grid"></div>
        </section>
    </main>

    <div id="requirements-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2 id="modal-title">الوثائق المطلوبة</h2>
            <ul id="requirements-list"></ul>
            <div class="modal-actions">
                <button class="btn-primary" id="close-modal-btn">إغلاق / Fermer</button>
            </div>
        </div>
    </div>

                    "شهادة عدم التسجيل بالحالة المدنية للوفيات",
                    "شهادة سكنى طالب(ة) تسجيل الوفاة",
                    "أن يكون طالب التسجيل من أقرباء المتوفى",
                    "إذا وقعت الوفاة خارج المغرب فمن الضروري مرور سنة كاملة من تاريخ الوفاة لتسجيلها بالمغرب"
                ],

                ]
            },
            {

                title_ar: "إصلاح الرسوم والتنقيحات والإضافات",

                    "Présentation obligatoire du livret d'état civil de l'intéressé, de son père ou de son grand-père selon le cas"
                ]
            },

                title_ar: "تغيير الاسم الشخصي",
                title_fr: "Changement de prénom",
                requirements_ar: [

                    "الإدلاء بكل ما هو مفيد في شأن الاسم الحقيقي"
                ],

                ]
            },

                id: "change_date",

                title_ar: "تغيير اليوم أو الشهر أو السنة",
                title_fr: "Changement du jour, du mois ou de l'année",
                requirements_ar: [
                    "مقال افتتاحي مرفوع للسيد رئيس المحكمة الابتدائية",

                    "حجج وأدلة كتابية تفيد الازدياد بالتاريخ المطالب به أو يفيد التاريخ الصحيح للولادة تكون أقوى حجة من التاريخ المضمن بصلب النسخة الكاملة للطالب"

            },

        const uiTranslations = {
            ar: {
                mainTitle: "البوابة الإلكترونية للحالة المدنية",
                subTitle: "دليل المواطن في قضايا الحالة المدنية - المحكمة الابتدائية",
                step1: "1. يرجى اختيار نوع الخدمة:",
                backBtn: "🔙 رجوع للرئيسية",
                step2Prefix: "الطلبات المتعلقة بـ: ",
                modalPrefix: "الوثائق المطلوبة لـ: ",
                closeBtn: "إغلاق",
                langToggle: "Français"
            },
            fr: {
                mainTitle: "Portail Électronique de l'État Civil",
                subTitle: "Guide du citoyen - Tribunal de Première Instance",
                step1: "1. Veuillez choisir le type de service :",
                backBtn: "🔙 Retour à l'accueil",
                step2Prefix: "Demandes liées à : ",
                modalPrefix: "Documents requis pour : ",
                closeBtn: "Fermer",
                langToggle: "العربية"
            }
        };

        let currentLang = 'ar';
        let selectedCategoryObj = null;

        const htmlTag = document.getElementById('html-tag');
        const langToggleBtn = document.getElementById('lang-toggle');
        const categorySection = document.getElementById('category-section');
        const servicesSection = document.getElementById('services-section');
        const categoriesGrid = document.getElementById('categories-grid');
        const servicesGrid = document.getElementById('services-grid');
        const backBtn = document.getElementById('back-to-categories');
        const selectedCategoryTitle = document.getElementById('selected-category-title');
        const modal = document.getElementById('requirements-modal');
        const modalTitle = document.getElementById('modal-title');
        const requirementsList = document.getElementById('requirements-list');
        const uiMainTitle = document.getElementById('ui-main-title');
        const uiSubTitle = document.getElementById('ui-sub-title');
        const uiStep1Title = document.getElementById('ui-step1-title');
        const uiCloseBtn = document.getElementById('close-modal-btn');

        function init() {
            renderCategories();
            updateUITexts();
        }

        langToggleBtn.onclick = () => {
            currentLang = currentLang === 'ar' ? 'fr' : 'ar';
            htmlTag.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            htmlTag.lang = currentLang;
            
            updateUITexts();
            renderCategories();
            
            if (selectedCategoryObj) {
                showServices(selectedCategoryObj);
            }
        };

        function updateUITexts() {
            const t = uiTranslations[currentLang];
            uiMainTitle.innerText = t.mainTitle;
            uiSubTitle.innerText = t.subTitle;
            uiStep1Title.innerText = t.step1;
            backBtn.innerText = t.backBtn;
            uiCloseBtn.innerText = t.closeBtn;
            langToggleBtn.innerText = t.langToggle;
        }

        function renderCategories() {
            categoriesGrid.innerHTML = '';
            const uniqueCategories = [];
            const categoryMap = new Map();

            servicesData.forEach(item => {
                const catName = currentLang === 'ar' ? item.category_ar : item.category_fr;
                if (!categoryMap.has(item.category_ar)) {
                    categoryMap.set(item.category_ar, true);
                    uniqueCategories.push({
                        ar: item.category_ar,
                        fr: item.category_fr,
                        display: catName
                    });
                }
            });

            uniqueCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'btn-category';
                btn.innerText = cat.display;
                btn.onclick = () => showServices(cat);
                categoriesGrid.appendChild(btn);
            });
        }

        function showServices(categoryObj) {
            selectedCategoryObj = categoryObj;
            categorySection.className = 'hidden-section';
            servicesSection.className = 'active-section';
            
            const t = uiTranslations[currentLang];
            selectedCategoryTitle.innerText = t.step2Prefix + (currentLang === 'ar' ? categoryObj.ar : categoryObj.fr);
            
            servicesGrid.innerHTML = '';

            const filteredServices = servicesData.filter(item => item.category_ar === categoryObj.ar);
            
            filteredServices.forEach(service => {
                const btn = document.createElement('button');
                btn.className = 'btn-service';
                btn.innerText = currentLang === 'ar' ? service.title_ar : service.title_fr;
                btn.onclick = () => showRequirements(service);
                servicesGrid.appendChild(btn);
            });
        }

        backBtn.onclick = () => {
            selectedCategoryObj = null;
            servicesSection.className = 'hidden-section';
            categorySection.className = 'active-section';
        };

        function showRequirements(service) {
            const t = uiTranslations[currentLang];
            const title = currentLang === 'ar' ? service.title_ar : service.title_fr;
            const reqs = currentLang === 'ar' ? service.requirements_ar : service.requirements_fr;

            modalTitle.innerText = t.modalPrefix + title;
            requirementsList.innerHTML = '';
            
            reqs.forEach(req => {
                const li = document.createElement('li');
                li.innerText = req;
                requirementsList.appendChild(li);
            });

            modal.style.display = 'block';
        }

        document.getElementById('close-modal').onclick = () => modal.style.display = 'none';
        uiCloseBtn.onclick = () => modal.style.display = 'none';

        init();
    </script>
</body>
</html>

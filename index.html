<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البوابة الإلكترونية للحالة المدنية - Kiosk</title>
    <!-- استدعاء خطوط Google Fonts لتحسين مظهر الكتابة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة توليد QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --primary-color: #0056b3; 
            --secondary-color: #f8f9fa;
            --text-color: #2c3e50;
            --accent-color: #28a745; 
            --bg-color: #f4f7f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; }

        /* تنسيق العنوان البارز في البداية */
        .kiosk-header { 
            background: linear-gradient(135deg, #0056b3 0%, #003d7a 100%); 
            color: white; 
            text-align: center; 
            padding: 50px 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        .kiosk-header h1 { 
            font-size: 3.2rem; 
            font-weight: 900; 
            letter-spacing: -1px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .kiosk-header p { font-size: 1.4rem; opacity: 0.95; font-weight: 400; }

        .lang-btn {
            position: absolute; top: 20px; right: 20px; 
            background-color: white; color: var(--primary-color); border: 2px solid var(--primary-color);
            padding: 10px 25px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; z-index: 100;
            transition: 0.3s;
        }
        .lang-btn:hover { background-color: var(--primary-color); color: white; }

        .kiosk-container { flex: 1; padding: 40px; max-width: 1200px; margin: 0 auto; width: 100%; }

        h2 { font-size: 2rem; margin-bottom: 30px; color: var(--primary-color); border-right: 5px solid var(--primary-color); padding-right: 15px; }

        .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

        button { font-size: 1.3rem; padding: 25px 20px; border-radius: 15px; border: none; cursor: pointer; transition: all 0.3s ease; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        button:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }

        .btn-category { background-color: white; color: var(--primary-color); border: 2px solid #e0e0e0; }
        .btn-service { background-color: white; color: #444; border: 1px solid #ddd; }
        .btn-category:hover, .btn-service:hover { border-color: var(--primary-color); background-color: #f0f7ff; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .modal-content { background-color: white; margin: 2% auto; padding: 40px; border-radius: 20px; width: 85%; max-width: 900px; position: relative; }

        /* تنسيق QR Code */
        #qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        #qrcode { margin-top: 10px; }
        .qr-label { font-weight: bold; color: #555; margin-bottom: 5px; }

        #requirements-list { margin-top: 20px; font-size: 1.2rem; line-height: 1.8; list-style-type: none; }
        #requirements-list li::before { content: "•"; color: var(--primary-color); font-weight: bold; display: inline-block; width: 1em; margin-right: -1em; }

        .active-section { display: block; animation: fadeIn 0.5s ease-in; }
        .hidden-section { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <button id="lang-toggle" class="lang-btn">Français</button>

    <header class="kiosk-header">
        <h1 id="ui-main-title">البوابة الإلكترونية للحالة المدنية</h1>
        <p id="ui-sub-title">دليل المواطن في قضايا الحالة المدنية - المحكمة الابتدائية</p>
    </header>

    <main class="kiosk-container">
        <section id="category-section" class="active-section">
            <h2 id="ui-step1-title">1. يرجى اختيار نوع الخدمة:</h2>
            <div id="categories-grid" class="btn-grid"></div>
        </section>

        <section id="services-section" class="hidden-section">
            <button id="back-to-categories" style="background:#6c757d; color:white; margin-bottom:20px;">🔙 رجوع</button>
            <h2 id="selected-category-title">2. اختر الطلب:</h2>
            <div id="services-grid" class="btn-grid"></div>
        </section>
    </main>

    <div id="requirements-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="border:none;">الوثائق المطلوبة</h2>
            <ul id="requirements-list"></ul>
            
            <!-- حاوية الـ QR Code -->
            <div id="qr-container" style="display:none;">
                <p class="qr-label">امسح الكود لتحميل المعلومات على هاتفك:</p>
                <div id="qrcode"></div>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <button id="close-modal-btn" style="background:var(--primary-color); color:white; padding:10px 40px;">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        const servicesData = [
            {
                id: "birth_ma_known",
                category_ar: "الولادات",
                category_fr: "Naissances",
                title_ar: "تسجيل ولادة من أبوين معلومين وقعت بالمغرب",
                title_fr: "Enregistrement d'une naissance de parents connus au Maroc",
                hasQR: true,
                requirements_ar: [
                    "مقال افتتاحي مرفوع للسيد رئيس المحكمة الابتدائية",
                    "أصل شهادة الولادة مسلمة من المستشفى أو السلطة المحلية",
                    "شهادة عدم التسجيل بالحالة المدنية للولادات",
                    "نسخة من عقد زواج أو الإقرار بنبوة عند الاقتضاء",
                    "نسخة من بطاقة تعريف الأبوين وكناش الحالة المدنية"
                ],
                requirements_fr: ["Requête au président", "Certificat de naissance original", "Attestation de non-inscription", "Acte de mariage", "CIN des parents"]
            },
            {
                id: "birth_unknown_father",
                category_ar: "الولادات",
                category_fr: "Naissances",
                title_ar: "تسجيل ولادة من أب مجهول",
                title_fr: "Enregistrement d'une naissance de père inconnu",
                hasQR: true,
                requirements_ar: [
                    "مقال افتتاحي مرفوع للسيد رئيس المحكمة الابتدائية",
                    "أصل شهادة الولادة مسلمة من المستشفى أو السلطة المحلية",
                    "شهادة عدم التسجيل بالحالة المدنية للولادات",
                    "اختيار اسم شخصي وعائلي للأب من قبل الأم"
                ],
                requirements_fr: ["Requête au président", "Certificat de naissance", "Attestation de non-inscription", "Choix du nom du père"]
            },
            {
                id: "birth_abroad",
                category_ar: "الولادات",
                category_fr: "Naissances",
                title_ar: "تسجيل ولادة من أبوين معلومين وقعت بالخارج",
                title_fr: "Enregistrement d'une naissance de parents connus à l'étranger",
                hasQR: true,
                requirements_ar: [
                    "مقال افتتاحي مرفوع للسيد رئيس المحكمة الابتدائية",
                    "أصل شهادة الولادة الأجنبية مترجمة لدى ترجمان محلف",
                    "شهادة عدم التسجيل بالحالة المدنية بالمغرب",
                    "نسخة من عقد الزواج مذيلة بالصيغة التنفيذية"
                ],
                requirements_fr: ["Requête au président", "Acte de naissance étranger traduit", "Attestation de non-inscription au Maroc", "Acte de mariage avec exequatur"]
            },
            // بقية البيانات تضاف هنا بشكل طبيعي...
            {
                id: "correction_additions",
                category_ar: "التعديلات",
                category_fr: "Modifications",
                title_ar: "إصلاح الرسوم والتنقيحات والإضافات",
                title_fr: "Rectification des actes",
                requirements_ar: ["مقال افتتاحي", "النسخة الكاملة لصاحب الطلب", "كناش الحالة المدنية"],
                requirements_fr: ["Requête", "Copie intégrale", "Livret d'état civil"]
            }
        ];

        const uiTranslations = {
            ar: { welcome: "مرحباً بكم في بوابتنا الإلكترونية للحالة المدنية", langToggle: "Français", close: "إغلاق", back: "🔙 رجوع" },
            fr: { welcome: "Bienvenue sur notre portail électronique de l'état civil", langToggle: "العربية", close: "Fermer", back: "🔙 Retour" }
        };

        let currentLang = 'ar';
        let qrcode = null;

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = currentLang === 'ar' ? 'ar-SA' : 'fr-FR';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        // الترحيب عند تحميل الصفحة
        window.onload = () => {
            renderCategories();
            // نحتاج لتفاعل من المستخدم أحياناً لتعمل الأصوات، لكن سنحاول تشغيلها فوراً
            setTimeout(() => speak(uiTranslations[currentLang].welcome), 1000);
        };

        function renderCategories() {
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = '';
            const cats = [...new Set(servicesData.map(s => s.category_ar))];
            cats.forEach(catAr => {
                const sObj = servicesData.find(s => s.category_ar === catAr);
                const btn = document.createElement('button');
                btn.className = 'btn-category';
                btn.innerText = currentLang === 'ar' ? catAr : sObj.category_fr;
                btn.onclick = () => showServices(catAr);
                grid.appendChild(btn);
            });
        }

        function showServices(catAr) {
            document.getElementById('category-section').classList.add('hidden-section');
            document.getElementById('services-section').classList.remove('hidden-section');
            const grid = document.getElementById('services-grid');
            grid.innerHTML = '';
            
            servicesData.filter(s => s.category_ar === catAr).forEach(service => {
                const btn = document.createElement('button');
                btn.className = 'btn-service';
                btn.innerText = currentLang === 'ar' ? service.title_ar : service.title_fr;
                btn.onclick = () => showRequirements(service);
                grid.appendChild(btn);
            });
        }

        function showRequirements(service) {
            const list = document.getElementById('requirements-list');
            const modal = document.getElementById('requirements-modal');
            const qrBox = document.getElementById('qr-container');
            list.innerHTML = '';
            
            const reqs = currentLang === 'ar' ? service.requirements_ar : service.requirements_fr;
            const title = currentLang === 'ar' ? service.title_ar : service.title_fr;
            
            document.getElementById('modal-title').innerText = title;
            
            let speechText = title + ". الوثائق المطلوبة هي: ";
            reqs.forEach((r, i) => {
                const li = document.createElement('li');
                li.innerText = r;
                list.appendChild(li);
                speechText += (i+1) + ". " + r + ". ";
            });

            // التعامل مع QR Code
            if(service.hasQR) {
                qrBox.style.display = 'flex';
                document.getElementById('qrcode').innerHTML = '';
                new QRCode(document.getElementById("qrcode"), {
                    text: "https://service-maroc.example.com/" + service.id, // استبدل برابط حقيقي إذا وجد
                    width: 128,
                    height: 128
                });
            } else {
                qrBox.style.display = 'none';
            }

            modal.style.display = 'block';
            speak(speechText);
        }

        document.getElementById('close-modal-btn').onclick = () => {
            document.getElementById('requirements-modal').style.display = 'none';
            window.speechSynthesis.cancel();
        };

        document.getElementById('back-to-categories').onclick = () => {
            document.getElementById('services-section').classList.add('hidden-section');
            document.getElementById('category-section').classList.remove('hidden-section');
        };

        document.getElementById('lang-toggle').onclick = function() {
            currentLang = currentLang === 'ar' ? 'fr' : 'ar';
            this.innerText = uiTranslations[currentLang === 'ar' ? 'fr' : 'ar'].langToggle;
            document.getElementById('html-tag').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            renderCategories();
            document.getElementById('services-section').classList.add('hidden-section');
            document.getElementById('category-section').classList.remove('hidden-section');
            speak(uiTranslations[currentLang].welcome);
        };
    </script>
</body>
</html>
